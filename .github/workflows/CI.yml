name: CI Pipeline

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - .editorconfig
      - docs/**
  pull_request: null

env:
  NODE_VERSION: 24

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Zip root directory
        run: |
          VERSION=$(git log -1 --pretty=%B)
          zip -r "discord-mygo-music.zip" . -x "AGENTS.md"

      - name: Create Release
        id: create_release
        run: |
          VERSION=$(git log -1 --pretty=%B)
          if echo "$VERSION" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "Release version $VERSION" \
              --target ${{ github.sha }} \
              "discord-mygo-music.zip"
          fi
          else
            echo "Skipping release creation for non-version tag: $VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
